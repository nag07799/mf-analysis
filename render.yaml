services:
  - type: web
    name: mf-api
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mf-postgres
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://mf-comparison.vercel.app,https://localhost:3000"
      - key: ENVIRONMENT
        value: production

  - type: pserv
    name: mf-postgres
    plan: free
    region: oregon
    ipAllowList: []
    envVars:
      - key: POSTGRES_USER
        value: mf_user
      - key: POSTGRES_PASSWORD
        generateValue: true
      - key: POSTGRES_DB
        value: mutual_funds
